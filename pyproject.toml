[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anya-lab"
version = "0.5.0"
description = "Competitive Intelligence Research Lab — Oracle Prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "numpy>=2.2,<3", "opencv-python-headless>=4.11,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]
ml = ["scikit-learn>=1.6,<2", "joblib>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
